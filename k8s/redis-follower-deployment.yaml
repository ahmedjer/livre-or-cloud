
# Deployment des Redis followers : copies du leader pour la lecture.
# RollingUpdate pour remplacer les pods sans coupure.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-follower
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-follower
    app.kubernetes.io/part-of: guestbook

spec:
  # 1 follower suffit pour les tests.
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: redis-follower

  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: redis-follower
        app.kubernetes.io/part-of: guestbook

    spec:
      containers:
        - name: redis-follower

          # Image follower officielle du Guestbook.
          image: us-docker.pkg.dev/google-samples/containers/gke/gb-redis-follower:v2
          imagePullPolicy: IfNotPresent

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          # Readiness : Redis doit répondre PONG.
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Liveness : redémarrage si Redis ne répond plus.
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # CPU et mémoire réservés (requests) et maximum (limits).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

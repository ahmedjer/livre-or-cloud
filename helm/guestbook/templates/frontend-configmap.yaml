{{/*
ConfigMap du frontend PHP.
Contient les variables d'environnement de l'application.
Chaque clé de frontend.env (values.yaml) donne une variable.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guestbook.componentName" (dict "root" . "component" "frontend") }}
  labels:
    {{- include "guestbook.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  {{- range $key, $value := .Values.frontend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

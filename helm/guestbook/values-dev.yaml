
# =====================================================
# Development Environment - Helm Overrides
# Release: stack-dev
# Namespace: dev
# =====================================================

# Preserve the immutable selectors of existing dev Deployments.
selectorInstanceOverride: "guestbook"

# Environment-specific labels.
commonLabels:
  environment: dev

# PHP Frontend configuration.
frontend:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  replicaCount: 1

  service:
    type: LoadBalancer
    port: 8080

# Redis Leader persistent storage.
redisLeader:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  persistence:
    size: 1Gi

# Number of Redis read replicas.
redisFollower:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  replicaCount: 1

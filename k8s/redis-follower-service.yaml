
# Service interne des Redis followers.
# Le frontend lit les messages via le nom redis-follower.

apiVersion: v1
kind: Service

metadata:
  name: redis-follower
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-follower
    app.kubernetes.io/part-of: guestbook

spec:
  # Redis ne doit pas être accessible en dehors du cluster.
  type: ClusterIP

  selector:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-follower

  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

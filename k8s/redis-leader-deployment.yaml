
# Deployment du Redis leader, avec ses données sur un volume persistant.
# Recreate : l'ancien pod est arrêté avant que le nouveau démarre.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-leader
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
    app.kubernetes.io/part-of: guestbook

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: redis-leader

  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: redis-leader
        app.kubernetes.io/part-of: guestbook

    spec:
      containers:
        - name: redis-leader
          image: docker.io/redis:6.0.5
          imagePullPolicy: IfNotPresent

          # On lance Redis avec notre fichier redis.conf.
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          # Readiness : le pod peut-il recevoir du trafic ?
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # Liveness : faut-il redémarrer Redis ?
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            # Le fichier redis.conf (ConfigMap).
            - name: redis-config
              mountPath: /usr/local/etc/redis
              readOnly: true

            # Les données Redis (volume persistant).
            - name: redis-data
              mountPath: /data

      volumes:
        - name: redis-config
          configMap:
            name: redis-leader-config

        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-leader-pvc

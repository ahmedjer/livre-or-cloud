# Chart Helm du livre d'or (Guestbook).
# Déploie le frontend PHP, le Redis leader (avec volume persistant)
# et les Redis followers.

apiVersion: v2

# Nom du chart.
name: guestbook

# Description du chart.
description: Livre d'or Guestbook (frontend PHP + Redis leader et followers) avec stockage persistant, pour les environnements dev, staging et prod.

# Chart d'application (pas une librairie).
type: application

# Version du chart. On l'augmente à chaque modification du chart.
# 0.2.0 : noms et labels générés par _helpers.tpl, ressources par environnement.
version: 0.2.0

# Version de l'application déployée.
appVersion: "1.0.0"

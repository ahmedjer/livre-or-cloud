{{/*
Service ClusterIP des Redis followers (interne au cluster).
Le nom doit rester "redis-follower" : le frontend lit les messages
sous ce nom (avec GET_HOSTS_FROM=dns).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redisFollower.service.name }}
  labels:
    {{- include "guestbook.componentLabels" (dict "root" . "component" "redis-follower") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "guestbook.componentSelectorLabels" (dict "root" . "component" "redis-follower") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redisFollower.service.port }}
      targetPort: redis
      protocol: TCP

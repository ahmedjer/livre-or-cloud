
# =====================================================
# Staging Environment - Helm Overrides
# Release: stack-staging
# Namespace: staging
# =====================================================

# Environment-specific labels.
commonLabels:
  environment: staging

# PHP Frontend configuration.
frontend:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  replicaCount: 2

  service:
    type: LoadBalancer
    port: 8081

# Redis Leader persistent storage.
redisLeader:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  persistence:
    size: 1Gi

# Number of Redis read replicas.
redisFollower:
  # moins de ressources qu'en prod
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  replicaCount: 2

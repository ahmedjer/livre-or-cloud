
# Deployment du frontend PHP (l'interface web du livre d'or).
# Les variables viennent de la ConfigMap frontend-config.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: guestbook

spec:
  # 1 pod pour le frontend.
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook
      app.kubernetes.io/instance: guestbook
      app.kubernetes.io/component: frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook
        app.kubernetes.io/instance: guestbook
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: guestbook

    spec:
      containers:
        - name: php-redis

          # Image officielle du frontend Guestbook.
          image: us-docker.pkg.dev/google-samples/containers/gke/gb-frontend:v5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Variables d'environnement lues dans la ConfigMap.
          envFrom:
            - configMapRef:
                name: frontend-config

          # Readiness : le pod reçoit du trafic seulement si la page / répond.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness : le conteneur est redémarré si la page / ne répond plus.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

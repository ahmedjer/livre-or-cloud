{{/*
Deployment des Redis followers (copies du leader, pour la lecture).
L'image se connecte toute seule à redis-leader au démarrage et
recopie les données : les followers n'ont pas besoin de volume.
*/}}
{{- $component := dict "root" . "component" "redis-follower" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guestbook.componentName" $component }}
  labels:
    {{- include "guestbook.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.redisFollower.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 1 pod en plus pendant la mise à jour, et jamais de pod en moins.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "guestbook.componentSelectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guestbook.componentLabels" $component | nindent 8 }}
    spec:
      containers:
        - name: redis-follower
          image: "{{ .Values.redisFollower.image.repository }}:{{ .Values.redisFollower.image.tag }}"
          imagePullPolicy: {{ .Values.redisFollower.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.redisFollower.service.port }}
              protocol: TCP
          {{- with .Values.redisFollower.args }}
          # Commande de démarrage, seulement si redisFollower.args est rempli
          # (utilisé sur Mac avec values-mac.yaml).
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            {{- toYaml .Values.redisFollower.readinessProbe | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            {{- toYaml .Values.redisFollower.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.redisFollower.resources | nindent 12 }}

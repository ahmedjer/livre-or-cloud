{{/*
Deployment du Redis leader (le seul Redis qui reçoit les écritures).
Stratégie Recreate : l'ancien pod est arrêté AVANT que le nouveau
démarre. Le volume est en ReadWriteOnce et un seul Redis doit écrire
dans /data à la fois (explication dans docs/decisions.md).
*/}}
{{- $component := dict "root" . "component" "redis-leader" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guestbook.componentName" $component }}
  labels:
    {{- include "guestbook.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.redisLeader.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "guestbook.componentSelectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guestbook.componentLabels" $component | nindent 8 }}
    spec:
      containers:
        - name: redis-leader
          image: "{{ .Values.redisLeader.image.repository }}:{{ .Values.redisLeader.image.tag }}"
          imagePullPolicy: {{ .Values.redisLeader.image.pullPolicy }}
          # On lance Redis avec notre fichier redis.conf.
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: {{ .Values.redisLeader.service.port }}
              protocol: TCP
          # redis-cli ping vérifie que Redis répond vraiment (réponse PONG).
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            {{- toYaml .Values.redisLeader.readinessProbe | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            {{- toYaml .Values.redisLeader.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.redisLeader.resources | nindent 12 }}
          volumeMounts:
            # Le fichier redis.conf (ConfigMap).
            - name: redis-config
              mountPath: /usr/local/etc/redis
              readOnly: true
            # Les données Redis (volume persistant).
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: {{ include "guestbook.componentName" $component }}
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "guestbook.componentName" $component }}-data

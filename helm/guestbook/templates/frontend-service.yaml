{{/*
Service du frontend. Le type est une valeur du chart :
  - LoadBalancer en local (avec minikube tunnel)
  - ClusterIP sur GKE pour tester (avec kubectl port-forward)
  - LoadBalancer sur GKE ensuite (IP publique)
Le port change selon l'environnement pour que les 3 frontends
ne prennent pas le même port avec minikube tunnel.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service.name }}
  labels:
    {{- include "guestbook.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type | default "ClusterIP" }}
  selector:
    {{- include "guestbook.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP

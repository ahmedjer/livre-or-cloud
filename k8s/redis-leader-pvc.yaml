
# PersistentVolumeClaim du Redis leader (monté sur /data).
# Pas de storageClassName : la StorageClass par défaut est utilisée.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-leader-pvc
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
    app.kubernetes.io/part-of: guestbook

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

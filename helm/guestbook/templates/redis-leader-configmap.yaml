{{/*
ConfigMap du Redis leader : contient le fichier redis.conf.
Ce fichier est monté dans le conteneur et donné à redis-server au
démarrage. C'est lui qui active la sauvegarde des messages sur /data.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guestbook.componentName" (dict "root" . "component" "redis-leader") }}
  labels:
    {{- include "guestbook.componentLabels" (dict "root" . "component" "redis-leader") | nindent 4 }}
data:
  redis.conf: |
    {{- .Values.redisLeader.redisConfig | nindent 4 }}

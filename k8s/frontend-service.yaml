
# Service du frontend, accessible depuis le poste avec minikube tunnel.

apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: guestbook

spec:
  # LoadBalancer : en local, minikube tunnel le rend accessible sur 127.0.0.1.
  type: LoadBalancer

  selector:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: frontend

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

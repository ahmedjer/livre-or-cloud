{{/*
Service ClusterIP du Redis leader (interne au cluster).
Le nom doit rester "redis-leader" : les images du frontend et des
followers cherchent Redis sous ce nom (avec GET_HOSTS_FROM=dns).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redisLeader.service.name }}
  labels:
    {{- include "guestbook.componentLabels" (dict "root" . "component" "redis-leader") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "guestbook.componentSelectorLabels" (dict "root" . "component" "redis-leader") | nindent 4 }}
  ports:
    - name: redis
      port: {{ .Values.redisLeader.service.port }}
      targetPort: redis
      protocol: TCP

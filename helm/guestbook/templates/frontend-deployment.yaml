{{/*
Deployment du frontend PHP (l'interface web du livre d'or).
Stratégie RollingUpdate : les pods sont remplacés un par un,
le site reste accessible pendant une mise à jour.
*/}}
{{- $component := dict "root" . "component" "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guestbook.componentName" $component }}
  labels:
    {{- include "guestbook.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 1 pod en plus pendant la mise à jour, et jamais de pod en moins.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "guestbook.componentSelectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "guestbook.componentLabels" $component | nindent 8 }}
    spec:
      containers:
        - name: php-redis
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP
          # Les variables viennent de la ConfigMap du frontend.
          envFrom:
            - configMapRef:
                name: {{ include "guestbook.componentName" $component }}
          # Readiness : le pod reçoit du trafic seulement si la page / répond.
          readinessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.readinessProbe | nindent 12 }}
          # Liveness : le conteneur est redémarré si la page / ne répond plus.
          livenessProbe:
            httpGet:
              path: /
              port: http
            {{- toYaml .Values.frontend.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

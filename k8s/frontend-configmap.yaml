
# ConfigMap du frontend PHP : variables d'environnement de l'application.

apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: guestbook

data:
  # Le frontend trouve Redis avec les noms des Services (DNS).
  GET_HOSTS_FROM: "dns"

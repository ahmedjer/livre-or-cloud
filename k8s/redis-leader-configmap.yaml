
# ConfigMap du Redis leader : le fichier redis.conf.

apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-leader-config
  labels:
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/instance: guestbook
    app.kubernetes.io/component: redis-leader
    app.kubernetes.io/part-of: guestbook

data:
  redis.conf: |
    # Écouter sur toutes les interfaces du pod.
    bind 0.0.0.0

    # Pas de mot de passe dans ce projet : on désactive le mode protégé.
    # En vraie production il faudrait un mot de passe.
    protected-mode no

    # Dossier des données = le volume persistant.
    dir /data

    # Mode AOF : chaque écriture est ajoutée au fichier appendonly.aof.
    appendonly yes

    # Écriture sur le disque après chaque commande.
    appendfsync always
